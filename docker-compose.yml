services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
      POSTGRES_DB: seatlock
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://seatlock:seatlock@db:5432/seatlock
      JWT_SECRET: change-me-in-real-life
      CORS_ORIGIN: http://localhost:3000
      PORT: "4000"
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:4000
    environment:
      BACKEND_URL: http://backend:4000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
